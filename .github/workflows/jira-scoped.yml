name: Jira Transition

on:
  push:
    branches:
      - "feature/**"

  pull_request:
    types:
      - opened
      - reopened
      - ready_for_review
      - closed

permissions:
  contents: read

jobs:

  jira-transition:

    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Extract Jira issue key and determine target status
      # ============================================================
      - name: Resolve Jira issue and target status
        id: resolve
        shell: bash
        run: |

          set -euo pipefail

          echo "GitHub event: ${{ github.event_name }}"
          echo "GitHub ref: $GITHUB_REF_NAME"

          # --------------------------------------------------------
          # Determine branch
          # --------------------------------------------------------

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BRANCH_NAME="${{ github.head_ref }}"
          else
            BRANCH_NAME="$GITHUB_REF_NAME"
          fi

          echo "Branch: $BRANCH_NAME"

          # --------------------------------------------------------
          # Extract Jira issue key
          #
          # Example:
          # feature/PER-1-test
          #
          # Result:
          # PER-1
          # --------------------------------------------------------

          ISSUE_KEY=$(echo "$BRANCH_NAME" |
            grep -oE '[A-Z][A-Z0-9]+-[0-9]+' |
            head -1 || true)

          if [[ -z "$ISSUE_KEY" ]]; then
            echo "No Jira issue key found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Jira issue: $ISSUE_KEY"

          # --------------------------------------------------------
          # Determine target status
          # --------------------------------------------------------

          TARGET_STATUS=""

          if [[ "${{ github.event_name }}" == "push" ]]; then

            TARGET_STATUS="In Progress"

          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then

            if [[ "${{ github.event.action }}" == "closed" &&
                  "${{ github.event.pull_request.merged }}" == "true" ]]; then

              TARGET_STATUS="Done"

            elif [[ "${{ github.event.action }}" == "closed" ]]; then

              echo "Pull request closed without merge."
              echo "No Jira transition required."

              echo "skip=true" >> "$GITHUB_OUTPUT"

              exit 0

            else

              TARGET_STATUS="In Progress"

            fi

          fi

          # --------------------------------------------------------
          # Validate target status
          # --------------------------------------------------------

          if [[ -z "$TARGET_STATUS" ]]; then

            echo "ERROR: Target Jira status is empty."

            exit 1

          fi

          echo ""
          echo "=========================================="
          echo "Jira issue : $ISSUE_KEY"
          echo "Target     : $TARGET_STATUS"
          echo "=========================================="

          # --------------------------------------------------------
          # GitHub outputs
          # --------------------------------------------------------

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "issue_key=$ISSUE_KEY" >> "$GITHUB_OUTPUT"
          echo "target_status=$TARGET_STATUS" >> "$GITHUB_OUTPUT"


      


      # ============================================================
      # 2. Test Jira scoped token
      # ============================================================

      - name: Verify Jira scoped token
        id: auth

        if: steps.resolve.outputs.skip != 'true'

        env:
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

        shell: bash

        run: |

          set -euo pipefail

          echo "Testing Jira scoped API token..."

          HTTP_CODE=$(curl -sS \
            --output /tmp/jira-response.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "https://api.atlassian.com/ex/jira/$JIRA_CLOUD_ID/rest/api/3/myself" \
            --header "Authorization: Bearer $JIRA_API_TOKEN" \
            --header "Accept: application/json")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            echo ""
            echo "Jira authentication failed."

            cat /tmp/jira-response.json

            exit 1

          fi

          echo ""
          echo "Jira scoped token authentication successful!"


      # ============================================================
      # 3. Read Jira issue
      # ============================================================

      - name: Read Jira issue
        id: issue

        if: steps.resolve.outputs.skip != 'true'

        env:
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.resolve.outputs.issue_key }}

        shell: bash

        run: |

          set -euo pipefail

          JIRA_API_URL="https://api.atlassian.com/ex/jira/$JIRA_CLOUD_ID/rest/api/3"

          echo ""
          echo "Reading Jira issue: $ISSUE_KEY"

          HTTP_CODE=$(curl -sS \
            --output /tmp/jira-issue.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "$JIRA_API_URL/issue/$ISSUE_KEY" \
            --header "Authorization: Bearer $JIRA_API_TOKEN" \
            --header "Accept: application/json")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            echo ""
            echo "Unable to read Jira issue."

            cat /tmp/jira-issue.json

            exit 1

          fi

          echo ""
          echo "Jira issue successfully read."

          echo ""
          echo "Summary:"

          jq -r '.fields.summary' /tmp/jira-issue.json

          echo ""
          echo "Current status:"

          jq -r '.fields.status.name' /tmp/jira-issue.json


      # ============================================================
      # 4. Get Jira transitions
      # ============================================================

      - name: Get Jira transitions
        id: transitions

        if: steps.resolve.outputs.skip != 'true'

        env:
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.resolve.outputs.issue_key }}

        shell: bash

        run: |

          set -euo pipefail

          JIRA_API_URL="https://api.atlassian.com/ex/jira/$JIRA_CLOUD_ID/rest/api/3"

          echo ""
          echo "Getting Jira transitions..."

          HTTP_CODE=$(curl -sS \
            --output /tmp/jira-transitions.json \
            --write-out "%{http_code}" \
            --request GET \
            --url "$JIRA_API_URL/issue/$ISSUE_KEY/transitions" \
            --header "Authorization: Bearer $JIRA_API_TOKEN" \
            --header "Accept: application/json")

          echo "HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then

            echo ""
            echo "Unable to get Jira transitions."

            cat /tmp/jira-transitions.json

            exit 1

          fi

          echo ""
          echo "Available Jira transitions:"

          jq -r '
            (.transitions // [])[]
            | "ID=\(.id) | Name=\(.name) | Target=\(.to.name)"
          ' /tmp/jira-transitions.json


      # ============================================================
      # 5. Transition Jira issue
      # ============================================================

      - name: Transition Jira issue
        id: transition

        if: steps.resolve.outputs.skip != 'true'

        env:
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.resolve.outputs.issue_key }}

          TARGET_STATUS: ${{ steps.resolve.outputs.target_status }}

        shell: bash

        run: |

          set -euo pipefail

          JIRA_API_URL="https://api.atlassian.com/ex/jira/$JIRA_CLOUD_ID/rest/api/3"

          echo ""
          echo "Target Jira status: $TARGET_STATUS"

          # --------------------------------------------------------
          # Get current status
          # --------------------------------------------------------

          CURRENT_STATUS=$(curl -sS \
            --request GET \
            --url "$JIRA_API_URL/issue/$ISSUE_KEY" \
            --header "Authorization: Bearer $JIRA_API_TOKEN" \
            --header "Accept: application/json" |
            jq -r '.fields.status.name')

          echo "Current Jira status: $CURRENT_STATUS"

          # --------------------------------------------------------
          # Already in target status
          # --------------------------------------------------------

          if [[ "$CURRENT_STATUS" == "$TARGET_STATUS" ]]; then

            echo ""
            echo "Issue is already in '$TARGET_STATUS'."

            echo "applied=false" >> "$GITHUB_OUTPUT"
            echo "already_in_target=true" >> "$GITHUB_OUTPUT"

            exit 0

          fi

          # --------------------------------------------------------
          # Get transitions
          # --------------------------------------------------------

          TRANSITIONS=$(curl -sS \
            --request GET \
            --url "$JIRA_API_URL/issue/$ISSUE_KEY/transitions" \
            --header "Authorization: Bearer $JIRA_API_TOKEN" \
            --header "Accept: application/json")

          # --------------------------------------------------------
          # Find transition ID
          # --------------------------------------------------------

          TRANSITION_ID=$(echo "$TRANSITIONS" |
            jq -r --arg TARGET "$TARGET_STATUS" '
              (.transitions // [])[]
              | select(.to.name == $TARGET)
              | .id
            ' |
            head -n 1)

          if [[ -z "$TRANSITION_ID" ||
                "$TRANSITION_ID" == "null" ]]; then

            echo ""
            echo "No transition found to '$TARGET_STATUS'."

            echo ""
            echo "Available transitions:"

            echo "$TRANSITIONS" |
              jq -r '
                (.transitions // [])[]
                | "ID=\(.id) | Name=\(.name) | Target=\(.to.name)"
              '

            exit 1

          fi

          echo ""
          echo "Transition ID: $TRANSITION_ID"

          # --------------------------------------------------------
          # Execute transition
          # --------------------------------------------------------

          HTTP_CODE=$(curl -sS \
            --output /tmp/transition-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "$JIRA_API_URL/issue/$ISSUE_KEY/transitions" \
            --header "Authorization: Bearer $JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "{\"transition\":{\"id\":\"$TRANSITION_ID\"}}")

          echo ""
          echo "Transition HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "204" ]; then

            echo ""
            echo "Jira transition failed."

            cat /tmp/transition-response.json

            exit 1

          fi

          echo ""
          echo "Jira issue moved to '$TARGET_STATUS'."

          echo "applied=true" >> "$GITHUB_OUTPUT"
          echo "already_in_target=false" >> "$GITHUB_OUTPUT"


      # ============================================================
      # 6. Add Jira comment
      # ============================================================

      - name: Add Jira comment

        if: steps.resolve.outputs.skip != 'true'

        env:
          JIRA_CLOUD_ID: ${{ secrets.JIRA_CLOUD_ID }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}

          ISSUE_KEY: ${{ steps.resolve.outputs.issue_key }}

          TARGET_STATUS: ${{ steps.resolve.outputs.target_status }}

          APPLIED: ${{ steps.transition.outputs.applied }}

          EVENT_NAME: ${{ github.event_name }}

          ACTOR: ${{ github.actor }}

          SHA: ${{ github.sha }}

          SERVER_URL: ${{ github.server_url }}

          REPOSITORY: ${{ github.repository }}

          PR_URL: ${{ github.event.pull_request.html_url }}

          PR_TITLE: ${{ github.event.pull_request.title }}

          PR_ACTION: ${{ github.event.action }}

        shell: bash

        run: |

          set -euo pipefail

          JIRA_API_URL="https://api.atlassian.com/ex/jira/$JIRA_CLOUD_ID/rest/api/3"

          # --------------------------------------------------------
          # Determine GitHub activity
          # --------------------------------------------------------

          if [[ "$EVENT_NAME" == "pull_request" ]]; then

            LINK="$PR_URL"

            ACTION_TEXT="Pull Request ($PR_ACTION): $PR_TITLE"

          else

            LINK="$SERVER_URL/$REPOSITORY/commit/$SHA"

            ACTION_TEXT="Push $SHA"

          fi

          # --------------------------------------------------------
          # Comment text
          # --------------------------------------------------------

          if [[ "$APPLIED" == "true" ]]; then

            NOTE="Jira status was moved to '$TARGET_STATUS'."

          else

            NOTE="Jira issue was already in '$TARGET_STATUS'."

          fi

          COMMENT="$ACTION_TEXT by $ACTOR. $NOTE $LINK"

          echo ""
          echo "Adding Jira comment..."

          echo "$COMMENT"

          # --------------------------------------------------------
          # Jira Cloud API v3 comment body
          # uses Atlassian Document Format
          # --------------------------------------------------------

          BODY=$(jq -n \
            --arg text "$COMMENT" \
            '{
              body: {
                type: "doc",
                version: 1,
                content: [
                  {
                    type: "paragraph",
                    content: [
                      {
                        type: "text",
                        text: $text
                      }
                    ]
                  }
                ]
              }
            }')

          HTTP_CODE=$(curl -sS \
            --output /tmp/comment-response.json \
            --write-out "%{http_code}" \
            --request POST \
            --url "$JIRA_API_URL/issue/$ISSUE_KEY/comment" \
            --header "Authorization: Bearer $JIRA_API_TOKEN" \
            --header "Accept: application/json" \
            --header "Content-Type: application/json" \
            --data "$BODY")

          echo ""
          echo "Comment HTTP status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "201" ]; then

            echo ""
            echo "Failed to add Jira comment."

            cat /tmp/comment-response.json

            exit 1

          fi

          echo ""
          echo "Jira comment added successfully."